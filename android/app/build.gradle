apply plugin: 'com.android.application'

def keystorePropertiesFile = rootProject.file("keystore.properties")
def keystoreProperties = new Properties()
if (keystorePropertiesFile.exists()) {
    keystoreProperties.load(new FileInputStream(keystorePropertiesFile))
}

android {
    namespace = "dk.meningspunktet.unofficial.app"
    compileSdk = rootProject.ext.compileSdkVersion
    defaultConfig {
        applicationId "dk.meningspunktet.unofficial.app"
        minSdkVersion rootProject.ext.minSdkVersion
        targetSdkVersion rootProject.ext.targetSdkVersion
        versionCode 7
        versionName "1.4.0-rc.0"
        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_21
        targetCompatibility JavaVersion.VERSION_21
    }
    signingConfigs {
        release {
            if (keystorePropertiesFile.exists()) {
                storeFile rootProject.file(keystoreProperties['storeFile'])
                storePassword keystoreProperties['storePassword']
                keyAlias keystoreProperties['keyAlias']
                keyPassword keystoreProperties['keyPassword']
            }
        }
    }
    buildTypes {
        release {
            minifyEnabled false
            // With keystore.properties absent (F-Droid builds, clean checkouts)
            // leave the release type unsigned -> app-release-unsigned.apk.
            if (keystorePropertiesFile.exists()) {
                signingConfig signingConfigs.release
            }
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }
}

dependencies {
    implementation "androidx.activity:activity:$androidxActivityVersion"
    implementation "androidx.core:core:$androidxCoreVersion"
    implementation "androidx.swiperefreshlayout:swiperefreshlayout:1.1.0"
}

// activity/lifecycle pull in androidx.profileinstaller, which contributes only a
// manifest receiver (ProfileInstallReceiver, exported behind DUMP) and an
// androidx.startup provider that write baseline profiles. No class here references
// it, so drop it (and startup-runtime, which only it requires): on Android 12+
// the platform installs profiles at install time anyway.
configurations.configureEach {
    exclude group: "androidx.profileinstaller", module: "profileinstaller"
}

// Pin every resolved version (direct + transitive) in gradle.lockfile; see the
// note in the root build.gradle.
dependencyLocking {
    lockAllConfigurations()
}
