// Top-level build file where you can add configuration options common to all sub-projects/modules.

buildscript {
    
    repositories {
        // Required: AGP (com.android.tools.build) and all AndroidX artifacts are
        // published only on Google's Maven index; Maven Central has no copies.
        google()
        mavenCentral()
        // CycloneDX SBOM plugin 2.x/3.x ships only on the Gradle Plugin
        // Portal; Maven Central is stuck on the 1.4.0 line.
        maven { url 'https://plugins.gradle.org/m2/' }
    }
    dependencies {
        classpath 'com.android.tools.build:gradle:9.5.1'
        classpath 'org.cyclonedx.bom:org.cyclonedx.bom.gradle.plugin:3.6.1'

        // Buildscript transitive bumps over AGP 9.5.1's pinned versions, purely
        // to clear Dependabot alerts (bcprov/bcpkix < 1.85, guava <= 33.7.1,
        // jose4j < 0.9.6); they are classpath-only, nothing ships in the APK.
        // Re-check when AGP is upgraded.
        classpath 'org.bouncycastle:bcprov-jdk18on:1.87'
        classpath 'org.bouncycastle:bcpkix-jdk18on:1.87'
        classpath 'org.bouncycastle:bcutil-jdk18on:1.87'
        classpath 'com.google.guava:guava:33.7.2-jre'
        classpath 'org.bitbucket.b_c:jose4j:0.9.6'
        classpath 'org.jdom:jdom2:2.0.6.1'
        classpath 'org.apache.httpcomponents:httpclient:4.5.14'
        classpath 'org.apache.commons:commons-lang3:3.18.0'

        // NOTE: Do not place your application dependencies here; they belong
        // in the individual module build.gradle files
    }
}

apply from: "variables.gradle"

// CycloneDX SBOM: `./gradlew cyclonedxBom` -> build/reports/cyclonedx/bom.{json,xml}
// (aggregate over all projects; each project also gets cyclonedxDirectBom under
// build/reports/cyclonedx-direct/). The release workflow publishes the JSON
// aggregate as a release artifact.
// Gradle dependency locking: gradle.lockfile pins resolved versions so builds
// (and Dependabot's PRs) are reproducible and reviewable; a compromised
// repository that starts publishing shifted versions fails the build instead
// of being silently pulled. Locking is a project-level setting: the block in
// app/build.gradle covers the app's dependency configurations, the one below
// covers the buildscript classpath (AGP, CycloneDX plugin). Regenerate with
// ./gradlew :app:dependencies --write-locks.
buildscript {
    configurations.classpath {
        resolutionStrategy.activateDependencyLocking()
    }
}

apply plugin: 'org.cyclonedx.bom'

allprojects {
    repositories {
        google()
        mavenCentral()
    }

    tasks.named('cyclonedxDirectBom') {
        // Only the release runtime classpath: what actually ships in the APK.
        includeConfigs = ['releaseRuntimeClasspath']
        failOnUnresolvedDependencies = true
    }
}

task clean(type: Delete) {
    delete rootProject.buildDir
}
