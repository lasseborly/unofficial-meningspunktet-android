version: 2

# Monthly cadence, one grouped PR per ecosystem. Dependabot cannot combine
# ecosystems into a single PR, so at most two PRs appear per month (one for
# GitHub Actions, one for Gradle). Renovate is the only option that can put both
# into one PR; this file deliberately stays on Dependabot.
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
    groups:
      # Every action bump in one PR. Grouping also keeps the CodeQL init and
      # analyze steps on the same version, which they must be to run at all.
      actions:
        patterns:
          - "*"

  # AGP / CycloneDX plugin in android/build.gradle and the AndroidX versions in
  # android/variables.gradle. The app ships only the AndroidX/Kotlin runtime, so
  # security fixes there matter most.
  - package-ecosystem: gradle
    directory: /android
    schedule:
      interval: monthly
    groups:
      gradle:
        patterns:
          - "*"
