version: 2

updates:
  # Keep the SHA-pinned actions in .github/workflows current. A bump PR rewrites
  # the pin and the version comment; review it like any code change.
  - package-ecosystem: github-actions
    directory: /
    # init and analyze must run the same github/codeql-action version; separate
    # PRs produce a mixed-version workflow that fails at runtime.
    groups:
      codeql-action:
        patterns:
          - "github/codeql-action*"
    schedule:
      interval: weekly

  # AGP / CycloneDX plugin in android/build.gradle and the AndroidX versions in
  # android/variables.gradle. The app ships only the AndroidX/Kotlin runtime, so
  # security fixes there matter most.
  - package-ecosystem: gradle
    directory: /android
    schedule:
      interval: weekly
