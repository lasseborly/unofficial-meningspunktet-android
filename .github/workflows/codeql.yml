name: CodeQL

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    - cron: "17 3 * * 1"
  workflow_dispatch:

permissions: {}

jobs:
  analyze:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-java@d1374f8ac74474200d16ef8ecee22c7ae7a51880 # v6.3.0
        with:
          distribution: temurin
          java-version: 21

      - uses: android-actions/setup-android@be39fa834029ff78f1a44aa3bb0819b8fc2bd8fd # v4.0.4

      - name: Install build-tools required by AGP 9.5
        # Runner images ship build-tools 35; AGP 9.5 requires 36.0.0 minimum.
        run: yes | android --no-metrics sdk install "build-tools;36.0.0"

      - uses: gradle/actions/setup-gradle@8da46b539cd8fe6ab27ca75128919a18d757604c # v6.4.1

      # build-mode: manual - full build-based extraction, but we drive the build
      # ourselves. Autobuild is not usable here: its Java detection reads AGP's
      # "recommended 17" and forces a Java 17 daemon, which AGP 9.5 lint rejects
      # on a Java 21 project (the JAVA_HOME env override is ignored).
      - name: Initialize CodeQL
        uses: github/codeql-action/init@33d7b85da1a04171e211befe2c739303b9a4c066 # v4.39.3
        with:
          languages: java-kotlin
          build-mode: manual

      # Same build the release workflow runs; setup-java above has already
      # pointed JAVA_HOME at Temurin 21 for the Gradle daemon.
      - name: Build for extraction
        run: (cd android && ./gradlew assembleRelease --stacktrace)

      - name: Analyze
        uses: github/codeql-action/analyze@33d7b85da1a04171e211befe2c739303b9a4c066 # v4.39.3
