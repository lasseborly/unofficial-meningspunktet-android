name: Dependency graph

# Submits the resolved dependency graph (from the committed lockfiles) so the
# GitHub dependency graph shows the real runtime classpath and Dependabot
# alerts fire on it. Same trigger cadence as the CodeQL workflow.

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    - cron: "23 3 * * 1"
  workflow_dispatch:

permissions: {}

jobs:
  submit:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-java@d1374f8ac74474200d16ef8ecee22c7ae7a51880 # v6.3.0
        with:
          distribution: temurin
          java-version: 21

      - uses: android-actions/setup-android@be39fa834029ff78f1a44aa3bb0819b8fc2bd8fd # v4.0.4

      - name: Install build-tools required by AGP 9.5
        # Runner images ship build-tools 35; AGP 9.5 requires 36.0.0 minimum.
        run: yes | android --no-metrics sdk install "build-tools;36.0.0"

      - uses: gradle/actions/setup-gradle@8da46b539cd8fe6ab27ca75128919a18d757604c # v6.4.1

      # Resolves the app's configurations (pinned by the committed lockfiles)
      # and submits the graph to the GitHub dependency graph API, where
      # Dependabot CVE alerts are computed from it.
      - name: Submit dependency graph
        uses: gradle/actions/dependency-submission@8da46b539cd8fe6ab27ca75128919a18d757604c # v6.4.1
        with:
          build-root-directory: android
          gradle-build-module: ":app"
